<text x="30" y="672" font-size="13" fill="#374151">颜色不需要额外的选择脚：HUB75 每个像素自带 R/G/B 三路通道，红蓝由数据位决定。</text>
<text x="30" y="696" font-size="13" fill="#374151">上半屏（第 0~31 行）走 R1/G1/B1，下半屏（第 32~63 行）走 R2/G2/B2，同时传输。</text>
<text x="30" y="720" font-size="13" fill="#b91c1c" font-weight="600">屏幕 +5V 单独用 5V/3A 电源供电，GND 必须和板子 GND 连在一起。</text>
